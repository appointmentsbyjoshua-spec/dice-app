<!DOCTYPE html>
<html>
<head>
<title>Dice Roller</title>
<style>
body{
font-family:Arial;
text-align:center;
margin-top:100px;
background:#111;
color:white;
}

button{
padding:15px 30px;
font-size:20px;
margin-top:20px;
cursor:pointer;
}

#dice{
font-size:80px;
margin-top:20px;
}
</style>
</head>

<body>

<h1>Dice Roller</h1>

<div id="dice">🎲</div>

<button onclick="rollDice()">Roll Dice</button>

<script>
function rollDice(){
let number = Math.floor(Math.random()*6)+1;

const diceFaces = ["⚀","⚁","⚂","⚃","⚄","⚅"];

document.getElementById("dice").innerHTML = diceFaces[number-1];
}
</script>

</body>
</html>
